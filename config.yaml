models:
  # OpenAI Models
  gpt-4o:
    provider: openai
    model_id: gpt-4o
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50
    
  gpt-4o-mini:
    provider: openai
    model_id: gpt-4o-mini
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50
    
  gpt-4-turbo:
    provider: openai
    model_id: gpt-4-turbo
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50
    
  gpt-3.5-turbo:
    provider: openai
    model_id: gpt-3.5-turbo
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50
    
  # Anthropic Models
  claude-opus:
    provider: anthropic
    model_id: claude-3-opus-20240229
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 40
    
  claude-sonnet:
    provider: anthropic
    model_id: claude-3-5-sonnet-20241022
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50
    
  claude-haiku:
    provider: anthropic
    model_id: claude-3-haiku-20240307
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50

  # Google Models (requires GOOGLE_API_KEY)
  gemini-pro:
    provider: google
    model_id: gemini-1.5-pro
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50
    
  gemini-flash:
    provider: google
    model_id: gemini-1.5-flash
    max_tokens: 4096
    temperature: 0.7
    rate_limit: 50

benchmarks:
  trust_eval:
    enabled: true
    tests:
      - safety
      - fairness
      - robustness
      - privacy
      - truthfulness
    
  decoding_trust:
    enabled: true
    perspectives:
      - toxicity
      - stereotype_bias
      - adv_robustness
      - out_of_distribution
      - privacy
      - machine_ethics
      - fairness

output:
  metrics_dir: metrics
  reports_dir: reports
  compliance_dir: compliance
  format: jsonl
